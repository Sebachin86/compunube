services:
 api1: &api
  build: .
  environment: [INSTANCE_NAME=api1]
 api2:
  <<: *api
  environment: [INSTANCE_NAME=api2]
 api3:
  <<: *api
  environment: [INSTANCE_NAME=api3]
 nginx:
  image: nginx:1.27-alpine
  ports: ["8080:80"]
  volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
  depends_on: [api1,api2,api3]
