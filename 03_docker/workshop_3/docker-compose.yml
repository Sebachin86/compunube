services:
 db:
  image: postgres:16-alpine
  environment: {POSTGRES_DB: lab, POSTGRES_USER: lab, POSTGRES_PASSWORD: labpass}
  volumes: ["pgdata:/var/lib/postgresql/data","./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
  healthcheck: {test: ["CMD-SHELL","pg_isready -U lab -d lab"], interval: 5s, timeout: 3s, retries: 10}
 api1: &api
  build: .
  environment: [DB_HOST=db,DB_NAME=lab,DB_USER=lab,DB_PASSWORD=labpass,INSTANCE_NAME=api1]
  depends_on: {db: {condition: service_healthy}}
 api2:
  <<: *api
  environment: [DB_HOST=db,DB_NAME=lab,DB_USER=lab,DB_PASSWORD=labpass,INSTANCE_NAME=api2]
 api3:
  <<: *api
  environment: [DB_HOST=db,DB_NAME=lab,DB_USER=lab,DB_PASSWORD=labpass,INSTANCE_NAME=api3]
 nginx:
  image: nginx:1.27-alpine
  ports: ["8082:80"]
  volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
  depends_on: [api1,api2,api3]
volumes: {pgdata:}
