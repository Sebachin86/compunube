services:
 web:
  image: nginx:1.27-alpine
  ports: ["8080:80"]
  volumes: ["./html:/usr/share/nginx/html:ro"]
  restart: unless-stopped
 tools:
  build: ./tools
  volumes: ["./logs:/logs"]
  command: ["bash","-c","while true; do /scripts/monitor.sh >> /logs/monitor.log 2>&1; sleep 30; done"]
  restart: unless-stopped
