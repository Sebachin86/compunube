services:
 api:
  image: ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/equipment-api:1.0
  restart: unless-stopped
  environment:
   DATABASE_URL: ${DATABASE_URL}
   AWS_REGION: ${AWS_REGION}
   S3_BUCKET: ${S3_BUCKET}
 nginx:
  image: nginx:1.27-alpine
  ports: ["80:80"]
  volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
  depends_on: [api]
