services:
 db:
  image: postgres:16-alpine
  environment:
   POSTGRES_DB: ${POSTGRES_DB:-equipment}
   POSTGRES_USER: ${POSTGRES_USER:-equipment}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
  volumes: ["equipment_data:/var/lib/postgresql/data","./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
  healthcheck:
   test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-equipment} -d ${POSTGRES_DB:-equipment}"]
   interval: 5s
   timeout: 3s
   retries: 15
 api:
  build: ./api
  environment:
   DATABASE_URL: ${DATABASE_URL}
   AWS_REGION: ${AWS_REGION:-us-east-1}
   S3_BUCKET: ${S3_BUCKET:-}
  depends_on: {db: {condition: service_healthy}}
 nginx:
  image: nginx:1.27-alpine
  ports: ["8080:80"]
  volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
  depends_on: [api]
volumes: {equipment_data:}
